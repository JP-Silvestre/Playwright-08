name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: e2e saucedemo tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test -- --workers=4 --project=chromium
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          APP_STANDARD_USERNAME: ${{ secrets.APP_STANDARD_USERNAME }}
          APP_LOCKED_OUT_USERNAME: ${{ secrets.APP_LOCKED_OUT_USERNAME }}
          APP_PROBLEM_USERNAME: ${{ secrets.APP_PROBLEM_USERNAME }}
          APP_PERFORMANCE_GLITCH_USERNAME: ${{ secrets.APP_PERFORMANCE_GLITCH_USERNAME }}
          APP_ERROR_USERNAME: ${{ secrets.APP_ERROR_USERNAME }}
          APP_VISUAL_USERNAME: ${{ secrets.APP_VISUAL_USERNAME }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
